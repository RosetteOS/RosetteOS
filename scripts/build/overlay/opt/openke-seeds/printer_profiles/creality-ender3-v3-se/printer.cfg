# Ender-3 V3 SE - OpenKE Klipper configuration

[respond]
default_type: echo

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4000
minimum_cruise_ratio: 0.5
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -11
position_min: -15
position_max: 220
homing_speed: 40
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 220
homing_speed: 40
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.6
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.6
stealthchop_threshold: 0
sense_resistor: 0.150

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: -24
y_offset: -20
z_offset: 0
probe_with_touch_mode: true
stow_on_each_sample: false
speed: 5
lift_speed: 20

[safe_z_home]
home_xy_position: 134, 130
speed: 100
z_hop: 10
z_hop_speed: 5

[filament_switch_sensor filament_sensor]
switch_pin: !PC15
pause_on_runout: false
runout_gcode: M600

[output_pin MainBoardFan]
pin: !PB1

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.04
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 20.584
pid_Ki: 1.737
pid_Kd: 60.981
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 70.652
pid_ki: 1.798
pid_kd: 694.157
min_temp: 0
max_temp: 110

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.0100
hardware_pwm: false
shutdown_speed: 0.0
off_below: 0.07

[heater_fan nozzle_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[bed_mesh]
speed: 200
mesh_min: 10, 10
mesh_max: 190, 195
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[input_shaper]

[skew_correction]

[exclude_object]

# --- Core Hardware & Sensors ---
[include hardware/nebula_pad.cfg]
[include hardware/v3_features.cfg]

# --- Print Controls & Workflow Macros ---
[include macros/print_start.cfg]
[include macros/mainsail.cfg]
[include macros/m600.cfg]
[include macros/print_settings.cfg]
[include macros/adaptive_meshing.cfg]
[include macros/line_purge.cfg]
[include macros/smart_park.cfg]
[include macros/camera.cfg]
[include macros/profiles.cfg]
[include macros/apps.cfg]

# --- Screen Integration ---
[include GuppyScreen/guppy_cmd.cfg]

# --- User Custom Overrides ---
[include user.cfg]
