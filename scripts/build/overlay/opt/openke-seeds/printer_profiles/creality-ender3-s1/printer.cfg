# Ender-3 S1 - OpenKE Klipper configuration

[respond]
default_type: echo

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
minimum_cruise_ratio: 0.5
max_z_velocity: 15
square_corner_velocity: 5.0
max_z_accel: 200

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_min: -5
position_endstop: -5
position_max: 245
homing_speed: 60

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_min: -2
position_endstop: -2
position_max: 230
homing_speed: 60

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 270
homing_speed: 5

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -30.0
y_offset: -40.0
z_offset: 0
speed: 10
stow_on_each_sample: false
probe_with_touch_mode: true

[safe_z_home]
home_xy_position: 145, 155
speed: 100
z_hop: 10
z_hop_speed: 5

[filament_switch_sensor filament_sensor]
switch_pin: ^!PC15
pause_on_runout: false
runout_gcode: M600

[extruder]
max_extrude_only_distance: 1000.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
rotation_distance: 7.5
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 23.904
pid_Ki: 1.476
pid_Kd: 96.810
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 74.000
pid_Ki: 1.965
pid_Kd: 696.525
min_temp: 0
max_temp: 110

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.0100
hardware_pwm: false
shutdown_speed: 0.0
off_below: 0.07

[heater_fan nozzle_fan]
pin: PC0
max_power: 1.0
shutdown_speed: 0
heater: extruder
heater_temp: 60
fan_speed: 1.0

[bed_mesh]
speed: 150
mesh_min: 15, 30
mesh_max: 210, 190
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]

[skew_correction]

[exclude_object]

# --- Core Hardware & Sensors ---
[include hardware/nebula_pad.cfg]

# --- Print Controls & Workflow Macros ---
[include macros/print_start.cfg]
[include macros/mainsail.cfg]
[include macros/m600.cfg]
[include macros/print_settings.cfg]
[include macros/adaptive_meshing.cfg]
[include macros/line_purge.cfg]
[include macros/smart_park.cfg]
[include macros/camera.cfg]
[include macros/profiles.cfg]
[include macros/apps.cfg]

# --- Screen Integration ---
[include GuppyScreen/guppy_cmd.cfg]

# --- User Custom Overrides ---
[include user.cfg]

[bed_screws]
screw1: 25, 33
screw1_name: front left screw
screw2: 202, 33
screw2_name: front right screw
screw3: 202, 202
screw3_name: rear right screw
screw4: 25, 202
screw4_name: rear left screw
horizontal_move_z: 5
speed: 150

[screws_tilt_adjust]
screw1: 55, 73
screw1_name: front left screw
screw2: 232, 73
screw2_name: front right screw
screw3: 232, 230
screw3_name: rear right screw
screw4: 55, 230
screw4_name: rear left screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4
