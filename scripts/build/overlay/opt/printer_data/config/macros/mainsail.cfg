[virtual_sdcard]
path: /opt/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when moving to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : True  ; allow to move the toolhead to park position on CANCEL_PRINT [True/False]
variable_park_at_cancel_x : 0.0   ; X position for CANCEL_PRINT parking
variable_park_at_cancel_y : 218.0 ; Y position for CANCEL_PRINT parking
variable_cancel_park_dz  : 20.0  ; safe Z lift before parking after CANCEL_PRINT
# !!! Caution [use_fw_retract: True] must be defined in printer.cfg if firmware retraction is used! !!!
variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the print when hitting the end of filament
# !!! Custom actions:
# user_pause_macro        : ""    ; Everything inside the "" will be executed before the default PAUSE
# user_resume_macro       : ""    ; Everything inside the "" will be executed before the default RESUME
# user_cancel_macro       : ""    ; Everything inside the "" will be executed before the default CANCEL_PRINT
gcode:

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  RESTORE_IDLE_TIMEOUT_M600
  ##### get user defines #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set allow_park = client.park_at_cancel|default(false)|lower == 'true' %}
  {% set retract = client.cancel_retract|default(5.0)|abs %}
  {% set sp_retract = client.speed_retract|default(35.0)|abs %}
  {% set park_x = "" if client.park_at_cancel_x is not defined
             else "X=" ~ client.park_at_cancel_x %}
  {% set park_y = "" if client.park_at_cancel_y is not defined
             else "Y=" ~ client.park_at_cancel_y %}
  {% set custom_park = park_x != "" or park_y != "" %}
  ##### end of definitions #####
  # restore idle_timeout time if needed
  {% if client.idle_timeout|default(0) > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
  {% endif %}
  {% if printer.pause_resume.is_paused|default(false) %}
    # clear pause state
    CLEAR_PAUSE
  {% endif %}
  # run user macro if defined
  {% if client.user_cancel_macro is defined and client.user_cancel_macro != "" %}
    {client.user_cancel_macro}
  {% endif %}
  # retract filament
  _CLIENT_RETRACT LENGTH={retract} SPEED={sp_retract}
  # park toolhead if requested
  {% if allow_park %}
    _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} Z_HOP={client.cancel_park_dz|default(20.0)}
  {% endif %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  SDCARD_RESET_FILE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  ##### get user defines #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set idle_timeout = client.idle_timeout|default(0) %}
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = False if printer.toolhead.extruder == ''
              else True  if params.RESTORE|default(1)|int == 1 else False %}
  ##### end of definitions #####
  {% if client.user_pause_macro is defined and client.user_pause_macro != "" %}
    {client.user_pause_macro}
  {% endif %}
  PAUSE_BASE
  _CLIENT_RETRACT
  _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
  {% if idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
  {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  RESTORE_IDLE_TIMEOUT_M600
  ##### get user defines #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set sp_unretract = client.speed_unretract|default(35.0)|abs %}
  {% set sp_retract = client.speed_retract|default(35.0)|abs %}
  {% set idle_timeout = client.idle_timeout|default(0) %}
  ##### end of definitions #####
  {% if client.user_resume_macro is defined and client.user_resume_macro != "" %}
    {client.user_resume_macro}
  {% endif %}
  {% if idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
  {% endif %}
  _CLIENT_EXTRUDE
  RESUME_BASE {rawparams}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
gcode:
  ##### get user defines #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set use_custom     = client.use_custom_pos|default(false)|lower == 'true' %}
  {% set custom_park_x  = client.custom_park_x|default(0.0) %}
  {% set custom_park_y  = client.custom_park_y|default(0.0) %}
  {% set park_dz        = params.Z_HOP|default(client.custom_park_dz|default(2.0))|float|abs %}
  {% set sp_hop         = client.speed_hop|default(15.0) * 60 %}
  {% set sp_move        = client.speed_move|default(100.0) * 60 %}
  ##### get park position #####
  {% set origin     = printer.gcode_move.homing_origin %}
  {% set act        = printer.gcode_move.gcode_position %}
  {% set max        = printer.toolhead.axis_maximum %}
  {% set cone       = printer.toolhead.cone_start_z|default(max.z) %} ; height limit for safe move
  {% set round_bed  = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch'] else False %}
  ##### calculate save lift position #####
  {% set z_safe = [act.z + park_dz, max.z]|min %}
  {% if not round_bed %}
    {% set x_park = params.X if params.X is defined
               else custom_park_x if use_custom
               else [max.x - 5.0, 0.0]|max %}
    {% set y_park = params.Y if params.Y is defined
               else custom_park_y if use_custom
               else [max.y - 5.0, 0.0]|max %}
  {% else %}
    {% set x_park = params.X if params.X is defined
               else custom_park_x if use_custom
               else 0.0 %}
    {% set y_park = params.Y if params.Y is defined
               else custom_park_y if use_custom
               else [max.y - 5.0, 0.0]|max %}
  {% endif %}
  ##### end of definitions #####
  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_safe} F{sp_hop}
    G1 X{x_park} Y{y_park} F{sp_move}
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Printer not homed'
  {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: Helper: retract filament used in PAUSE and CANCEL_PRINT
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set length = params.LENGTH|default(client.retract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_retract)|default(35.0)|float %}
  {% set use_fw_retract = client.use_fw_retract|default(false)|lower == 'true' %}
  {% if printer[printer.toolhead.extruder].can_extrude|default("true") %}
    {% if use_fw_retract and 'firmware_retraction' in printer %}
      G10
    {% else %}
      SAVE_GCODE_STATE NAME=_CLIENT_RETRACT
      G91
      G1 E-{length} F{speed * 60}
      RESTORE_GCODE_STATE NAME=_CLIENT_RETRACT
    {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Extruder not hot enough'
  {% endif %}

[gcode_macro _CLIENT_EXTRUDE]
description: Helper: extrude filament used in RESUME
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set length = params.LENGTH|default(client.unretract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_unretract)|default(35.0)|float %}
  {% set use_fw_retract = client.use_fw_retract|default(false)|lower == 'true' %}
  {% if printer[printer.toolhead.extruder].can_extrude|default("true") %}
    {% if use_fw_retract and 'firmware_retraction' in printer %}
      G11
    {% else %}
      SAVE_GCODE_STATE NAME=_CLIENT_EXTRUDE
      G91
      G1 E{length} F{speed * 60}
      RESTORE_GCODE_STATE NAME=_CLIENT_EXTRUDE
    {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Extruder not hot enough'
  {% endif %}
