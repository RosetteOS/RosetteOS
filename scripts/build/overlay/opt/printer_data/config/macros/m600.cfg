# Filament-change support for slicer-generated M600 commands.
#
# Uses the shared Mainsail PAUSE/RESUME macros for print-state handling,
# retraction, parking, and restoration. The helpers below only move filament.

[gcode_macro M600]
description: Pause the print and guide a filament change
variable_target_temp: 0
variable_saved_idle_timeout: 600
variable_idle_timeout_active: 0
gcode:
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=target_temp VALUE={printer.extruder.target|int}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=saved_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout|default(600)|int}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=idle_timeout_active VALUE=1
  SET_IDLE_TIMEOUT TIMEOUT=3600
  PAUSE
  LIFT_Z_M600
  RESPOND TYPE=command MSG="action:prompt_begin Filament change"
  RESPOND TYPE=command MSG="action:prompt_text Change the filament, load it, then resume the print."
  RESPOND TYPE=command MSG="action:prompt_button UNLOAD|UNLOAD_FILAMENT_M600|secondary"
  RESPOND TYPE=command MSG="action:prompt_button LOAD|LOAD_FILAMENT_M600|secondary"
  RESPOND TYPE=command MSG="action:prompt_button PURGE MORE|PURGE_MORE_FILAMENT_M600|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button CANCEL PRINT|CANCEL_PRINT_M600|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button IGNORE|CLOSE_PROMPT_M600|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button RESUME|RESUME_PRINT_M600|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro RESTORE_IDLE_TIMEOUT_M600]
description: Restore the configured idle timeout after M600
gcode:
  {% set m600 = printer['gcode_macro M600'] %}
  {% if m600.idle_timeout_active|int == 1 %}
    SET_IDLE_TIMEOUT TIMEOUT={m600.saved_idle_timeout|int}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=idle_timeout_active VALUE=0
  {% endif %}

[gcode_macro LIFT_Z_M600]
description: Raise the parked nozzle for a filament change
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set desired_lift = 50.0 if current_z < 50.0 else 2.0 %}
    {% set lift = [desired_lift, max_z - current_z]|min %}
    {% if lift > 0 %}
      SAVE_GCODE_STATE NAME=M600_LIFT_STATE
      G91
      G1 Z{lift} F600
      RESTORE_GCODE_STATE NAME=M600_LIFT_STATE
    {% endif %}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT_M600]
description: Heat the nozzle and unload filament
gcode:
  {% set target = printer['gcode_macro M600'].target_temp|int %}
  {% if target > 0 %}
    M109 S{target}
    SAVE_GCODE_STATE NAME=_M600_UNLOAD_STATE
    G91
    G1 E20 F180
    G1 E-80 F1800
    RESTORE_GCODE_STATE NAME=_M600_UNLOAD_STATE
    RESPOND TYPE=echo MSG="Filament unloaded."
  {% else %}
    {action_raise_error("M600 did not capture a hotend target temperature")}
  {% endif %}

[gcode_macro LOAD_FILAMENT_M600]
description: Heat the nozzle and load filament
gcode:
  {% set target = printer['gcode_macro M600'].target_temp|int %}
  {% if target > 0 %}
    M109 S{target}
    SAVE_GCODE_STATE NAME=_M600_LOAD_STATE
    G91
    G1 E100 F600
    RESTORE_GCODE_STATE NAME=_M600_LOAD_STATE
    RESPOND TYPE=echo MSG="Filament loaded."
  {% else %}
    {action_raise_error("M600 did not capture a hotend target temperature")}
  {% endif %}

[gcode_macro PURGE_MORE_FILAMENT_M600]
description: Purge a little more filament
gcode:
  {% set target = printer['gcode_macro M600'].target_temp|int %}
  {% if target > 0 %}
    M109 S{target}
    SAVE_GCODE_STATE NAME=_M600_PURGE_STATE
    G91
    G1 E10 F300
    RESTORE_GCODE_STATE NAME=_M600_PURGE_STATE
  {% else %}
    {action_raise_error("M600 did not capture a hotend target temperature")}
  {% endif %}

[gcode_macro CLOSE_PROMPT_M600]
description: Close the filament-change prompt
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro CANCEL_PRINT_M600]
description: Close the filament-change prompt and cancel the print
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  CANCEL_PRINT

[gcode_macro RESUME_PRINT_M600]
description: Close the filament-change prompt and resume the print
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESUME
