# RosetteOS App Store & UI Switcher Macros

[gcode_shell_command rosetteos_app_cmd]
command: /usr/bin/rosetteos-app
timeout: 300.0
verbose: True

[gcode_macro APPSTORE_STATUS]
description: Display current App Store status, active UIs, and installed applications
gcode:
  RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="status"

[gcode_macro APPSTORE_LIST]
description: List available and installed applications (e.g. APPSTORE_LIST, or APPSTORE_LIST CATEGORY=web_ui)
gcode:
  {% set category = params.CATEGORY|default("")|string %}
  {% if category != "" %}
    RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="list --category {category}"
  {% else %}
    RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="list"
  {% endif %}

[gcode_macro APPSTORE_UPDATE_CATALOG]
description: Refresh App Store catalog from remote repository
gcode:
  RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="update"

[gcode_macro APPSTORE_INSTALL]
description: Install an application from the App Store (e.g. APPSTORE_INSTALL APP=fluidd [ACTIVATE=1] [FORCE=1])
gcode:
  {% set app = params.APP|default("")|string %}
  {% set activate = params.ACTIVATE|default(0)|int %}
  {% set force = params.FORCE|default(0)|int %}
  {% if app != "" %}
    {% set p = "install " ~ app %}
    {% if activate == 1 %}
      {% set p = p ~ " --activate" %}
    {% endif %}
    {% if force == 1 %}
      {% set p = p ~ " --force" %}
    {% endif %}
    {action_respond_info("Installing " ~ app ~ " from App Store...")}
    RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="{p}"
  {% else %}
    {action_respond_info("Usage: APPSTORE_INSTALL APP=<app_id> [ACTIVATE=1] [FORCE=1]")}
  {% endif %}

[gcode_macro APPSTORE_UPGRADE]
description: Upgrade installed application(s) to the latest catalog version (e.g. APPSTORE_UPGRADE APP=fluidd or APPSTORE_UPGRADE)
gcode:
  {% set app = params.APP|default("all")|string %}
  {% set force = params.FORCE|default(0)|int %}
  {% set p = "upgrade " ~ app %}
  {% if force == 1 %}
    {% set p = p ~ " --force" %}
  {% endif %}
  {action_respond_info("Upgrading application(s): " ~ app ~ "...")}
  RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="{p}"

[gcode_macro SET_ACTIVE_WEB_UI]
description: Switch active Web UI (e.g. SET_ACTIVE_WEB_UI APP=fluidd or mainsail [FORCE=1])
gcode:
  {% set app = params.APP|default("")|string %}
  {% set force = params.FORCE|default(0)|int %}
  {% if app != "" %}
    {% set p = "set-active-web " ~ app %}
    {% if force == 1 %}
      {% set p = p ~ " --force" %}
    {% endif %}
    {action_respond_info("Switching active Web UI to: " ~ app ~ "...")}
    RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="{p}"
  {% else %}
    {action_respond_info("Usage: SET_ACTIVE_WEB_UI APP=<mainsail|fluidd> [FORCE=1]")}
  {% endif %}

[gcode_macro SET_ACTIVE_TOUCH_UI]
description: Switch active Touchscreen UI (e.g. SET_ACTIVE_TOUCH_UI APP=guppyscreen or helixscreen [FORCE=1])
gcode:
  {% set app = params.APP|default("")|string %}
  {% set force = params.FORCE|default(0)|int %}
  {% if app != "" %}
    {% set p = "set-active-touch " ~ app %}
    {% if force == 1 %}
      {% set p = p ~ " --force" %}
    {% endif %}
    {action_respond_info("Switching active Touchscreen UI to: " ~ app ~ "...")}
    RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="{p}"
  {% else %}
    {action_respond_info("Usage: SET_ACTIVE_TOUCH_UI APP=<guppyscreen|helixscreen> [FORCE=1]")}
  {% endif %}

[gcode_macro APPSTORE_REMOVE]
description: Uninstall and remove an application (e.g. APPSTORE_REMOVE APP=fluidd [FORCE=1])
gcode:
  {% set app = params.APP|default("")|string %}
  {% set force = params.FORCE|default(0)|int %}
  {% if app != "" %}
    {% set p = "remove " ~ app %}
    {% if force == 1 %}
      {% set p = p ~ " --force" %}
    {% endif %}
    {action_respond_info("Removing " ~ app ~ "...")}
    RUN_SHELL_COMMAND CMD=rosetteos_app_cmd PARAMS="{p}"
  {% else %}
    {action_respond_info("Usage: APPSTORE_REMOVE APP=<app_id> [FORCE=1]")}
  {% endif %}
