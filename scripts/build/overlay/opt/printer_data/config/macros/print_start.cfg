[gcode_macro PRINT_START]
description: Start print sequence with optional bed heatsoak, adaptive meshing, and adaptive line purge.
gcode:
    {% set rosetteos_settings = printer["gcode_macro _RosetteOS_Settings"] %}  # Read the shared RosetteOS print settings.
    {% set bed_temp = params.BED_TEMP | default(params.BED | default(0)) | float %}  # Read the target bed temperature requested by the slicer.
    {% set extruder_temp = params.EXTRUDER_TEMP | default(params.EXTRUDER | default(0)) | float %}  # Read the target nozzle temperature requested by the slicer.
    {% set bed_soak_time = params.BED_SOAK_TIME | default(rosetteos_settings.print_start_bed_heatsoak_time) | float %}  # Read the bed-soak duration in minutes.
    {% set adaptive_mesh = params.ADAPTIVE_MESH | default(rosetteos_settings.print_start_adaptive_bed_mesh) | int %}  # Determine whether adaptive bed meshing is enabled.
    {% set skirt_distance = params.SKIRT_DISTANCE | default(rosetteos_settings.print_start_skirt_distance) | float %}  # Read the extra distance beyond the skirt.
    {% set purge_enable = params.PURGE_ENABLE | default(rosetteos_settings.print_start_purge_enable) | int %}  # Determine whether the purge line is enabled.
    {% set verbose = params.VERBOSE | default(rosetteos_settings.print_start_verbose) | int %}  # Determine whether verbose status reporting is enabled.
    {% set bed_min_temp = printer.configfile.settings.heater_bed.min_temp | float %}  # Read the configured minimum bed temperature.
    {% set bed_max_temp = printer.configfile.settings.heater_bed.max_temp | float %}  # Read the configured maximum bed temperature.
    {% set extruder_min_temp = printer.configfile.settings.extruder.min_temp | float %}  # Read the configured minimum nozzle temperature.
    {% set extruder_max_temp = printer.configfile.settings.extruder.max_temp | float %}  # Read the configured maximum nozzle temperature.
    {% set purge_margin = rosetteos_settings.purge_margin | float %}  # Read the configured distance before the purge line.
    {% set purge_amount = rosetteos_settings.purge_amount | float %}  # Read the configured purge-line length.
    {% set purge_mesh_margin = skirt_distance + purge_margin + purge_amount if purge_enable else skirt_distance %}  # Include the skirt and purge line in the mesh margin when purging is enabled.
    {% set mesh_margin = [rosetteos_settings.mesh_margin | float, purge_mesh_margin] | max %}  # Use the larger configured or automatically required mesh margin.

    {% if bed_soak_time < 0 %}  # Reject negative bed-soak durations before starting the printer.
        CANCEL_PRINT  # Cancel the active print when the bed-soak duration is invalid.
        { action_raise_error("PRINT_START BED_SOAK_TIME must be zero or greater.") }  # Stop the macro with a clear error.
    {% endif %}  # Finish validating the bed-soak duration.
    {% if bed_temp < bed_min_temp or bed_temp > bed_max_temp %}  # Reject bed temperatures outside the configured safe range.
        CANCEL_PRINT  # Cancel the active print when the bed temperature is unsafe.
        { action_raise_error("PRINT_START BED_TEMP is outside the configured heater bed limits.") }  # Stop the macro with a clear error.
    {% endif %}  # Finish validating the bed temperature.
    {% if extruder_temp < extruder_min_temp or extruder_temp > extruder_max_temp %}  # Reject nozzle temperatures outside the configured safe range.
        CANCEL_PRINT  # Cancel the active print when the nozzle temperature is unsafe.
        { action_raise_error("PRINT_START EXTRUDER_TEMP is outside the configured extruder limits.") }  # Stop the macro with a clear error.
    {% endif %}  # Finish validating the nozzle temperature.
    {% if 'ADAPTIVE_MESH' in params and params.ADAPTIVE_MESH not in ['0', '1'] %}  # Accept only explicit zero or one for adaptive meshing.
        CANCEL_PRINT  # Cancel the active print when the adaptive-mesh argument is invalid.
        { action_raise_error("PRINT_START ADAPTIVE_MESH must be 0 or 1.") }  # Stop the macro with a clear error.
    {% endif %}  # Finish validating the adaptive-mesh argument.
    {% if 'PURGE_ENABLE' in params and params.PURGE_ENABLE not in ['0', '1'] %}  # Accept only explicit zero or one for purging.
        CANCEL_PRINT  # Cancel the active print when the purge argument is invalid.
        { action_raise_error("PRINT_START PURGE_ENABLE must be 0 or 1.") }  # Stop the macro with a clear error.
    {% endif %}  # Finish validating the purge argument.
    {% if 'VERBOSE' in params and params.VERBOSE not in ['0', '1'] %}  # Accept only explicit zero or one for status reporting.
        CANCEL_PRINT  # Cancel the active print when the verbose argument is invalid.
        { action_raise_error("PRINT_START VERBOSE must be 0 or 1.") }  # Stop the macro with a clear error.
    {% endif %}  # Finish validating the verbose argument.

    {% if verbose %}  # Report arguments and feature states only when verbose output is enabled.
        { action_respond_info("PRINT_START arguments: BED_TEMP={} C, EXTRUDER_TEMP={} C, BED_SOAK_TIME={} min, ADAPTIVE_MESH={}, SKIRT_DISTANCE={} mm, PURGE_ENABLE={}, MESH_MARGIN={} mm.".format(bed_temp, extruder_temp, bed_soak_time, adaptive_mesh, skirt_distance, purge_enable, mesh_margin)) }  # Report all PRINT_START argument values and the effective mesh margin.
        { action_respond_info("PRINT_START features: adaptive meshing {}, bed heatsoak {}, purging {}.".format("enabled" if adaptive_mesh else "disabled", "enabled" if bed_soak_time > 0 else "disabled", "enabled" if purge_enable else "disabled")) }  # Report the effective configurable feature states.
    {% endif %}  # Finish optional verbose status reporting.

    G90  # Use absolute coordinates for the start sequence.
    M140 S{bed_temp}  # Start heating the bed without waiting for it.
    {% if printer.toolhead.homed_axes != 'xyz' %}  # Home only when all printer axes are not already homed.
        G28  # Home all printer axes when homing is incomplete.
    {% endif %}  # Finish the conditional homing step.
    M190 S{bed_temp}  # Wait for the bed to reach the requested temperature.
    {% if bed_soak_time > 0 %}  # Heatsoak the bed only when a positive duration was requested.
        { action_respond_info("Heatsoaking bed for {} minutes.".format(bed_soak_time)) }  # Report the requested heatsoak duration.
        G4 P{(bed_soak_time * 60000) | int}  # Dwell for the requested number of minutes before probing.
    {% endif %}  # Finish the optional bed heatsoak.
    M104 S140  # Start heating the nozzle to 140 C immediately before bed meshing.
    {% if adaptive_mesh %}  # Select adaptive or standard bed meshing from the PRINT_START argument.
        BED_MESH_CALIBRATE MESH_MARGIN={mesh_margin}  # Create an adaptive bed mesh covering the skirt and purge line.
    {% else %}  # Use the original bed-mesh command when adaptive meshing is disabled.
        _BED_MESH_CALIBRATE  # Create a standard bed mesh without object-based bounds.
    {% endif %}  # Finish selecting the bed-meshing mode.
    SMART_PARK  # Park the printhead near the print area before nozzle heating.
    M109 S{extruder_temp}  # Heat the nozzle and wait for it to reach the requested temperature.
    {% if purge_enable %}  # Run the purge only when purging is enabled.
        G92 E0  # Reset the extruder position before purging.
        LINE_PURGE SKIRT_DISTANCE={skirt_distance}  # Purge outside the skirt using the existing adaptive line-purge macro.
    {% endif %}  # Finish the optional purge step.
    G92 E0  # Reset the extruder position at the end of every print-start sequence.
