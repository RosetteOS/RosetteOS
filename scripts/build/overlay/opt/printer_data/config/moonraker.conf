# RosetteOS - Moonraker config for the app-stack proof-of-
# pipeline build (FIRMWARE.md sec 13). klippy_uds_address matches the
# APISOCK path in S55klipper's own invocation of klippy.py.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/comms/klippy.sock

[zeroconf]

[octoprint_compat]

# Moonraker populates exclude_object.objects with per-object polygons from
# sliced-gcode metadata when object processing is enabled; without metadata the
# list remains empty and the printer configuration remains safe.
# The printer_profiles directory (/usr/data/rosetteos/printer_profiles/) is linked
# directly in the config root so users can view, edit, and back up all model configurations
# in Mainsail / Fluidd.
[file_manager]
enable_object_processing: True

# RosetteOS addition (FIRMWARE.md sec 13, stock-parity investigation): without
# a [machine] section, Moonraker defaults to the "systemd_cli" provider,
# which fails outright on this Buildroot/BusyBox image ("The name
# org.freedesktop.systemd1 was not provided by any .service files") since
# there's no systemd or D-Bus service manager here. Stock's own real
# Moonraker install (Creality-Helper-Script, /usr/data/printer_data/config/
# moonraker.conf on the same physical device) uses the exact same values
# below, paired with a real, proven /usr/bin/supervisorctl shim (see that
# file's own header) that drives our /etc/init.d/S* scripts directly - no
# systemd, no real supervisord daemon needed either. validate_service/
# validate_config are real Moonraker options (not warning suppression);
# stock disables them because supervisorctl.d config-file validation
# doesn't apply to this shim.
[machine]
provider: supervisord_cli
validate_service: False
validate_config: False

# USB/webcam stock-parity mission (2026-07-26), corrected by the Moonraker
# update/camera implementation mission (2026-07-27, see
# docs/NEBULAOS_MOONRAKER_UPDATE_AND_CAMERA_ANALYSIS.md): there is
# deliberately no active [webcam ...] section here anymore. A config-defined
# webcam is re-parsed from this file on every single Moonraker startup (it
# is NOT copied into the database "the first time it sees it" - a prior
# comment here claimed exactly that and was factually wrong, confirmed
# directly against vendor/moonraker's webcam.py source) and is permanently
# forbidden from being edited or deleted via the webcam API for as long as
# any [webcam ...] section defines it - a hard Moonraker server-side rule
# (WebcamManager._handle_webcam_request's own source=="config" check), not
# a Mainsail UI choice. RosetteOS's own default camera is instead seeded
# once into Moonraker's database (source="database") by
# S57rosetteos-camera-seed, the first time Moonraker is confirmed healthy -
# see that script for the exact one-time, idempotent, marker-guarded seed
# logic. A database-sourced camera is fully editable/deletable through
# Mainsail like any user-added camera, and a deliberate user deletion is
# never reversed by a later boot (the seed marker prevents recreation).

# RosetteOS mutable-runtime mission: keep Moonraker package updates disabled
# while allowing explicit user-triggered Klipper, Moonraker, and Mainsail
# channel updates through the validated update-manager workflow.
[update_manager]
enable_auto_refresh: False
enable_system_updates: False

# Moonraker update/camera implementation mission (2026-07-27, see
# docs/NEBULAOS_MOONRAKER_UPDATE_AND_CAMERA_ANALYSIS.md): "klipper" and
# "moonraker" are Moonraker's own two RESERVED update_manager slots, not
# generic extensions - confirmed directly against vendor/moonraker's
# update_manager/common.py (get_base_configuration/BASE_CONFIG/
# OPTION_OVERRIDES). For these two reserved names, Moonraker hardcodes
# type/origin/managed_services/requirements internally and auto-discovers
# path/executable/virtualenv live (Klipper's from its own identify
# handshake over KlippyConnection; Moonraker's own from sys.exec_prefix/
# source_info) - the ONLY options a [update_manager klipper]/
# [update_manager moonraker] section can actually override are channel,
# pinned_commit, refresh_interval, and report_anomalies. Every other
# option previously listed here (type, path, origin, primary_branch,
# managed_services, virtualenv, requirements) was silently never read -
# each one surfaced as a permanent "Unparsed config option" warning on
# every single boot, on a byte-for-byte fresh install, not because of any
# The reduced reserved-slot shape above is intentional: Moonraker only reads
# channel, pinned_commit, refresh_interval, and report_anomalies for these
# built-in Klipper and Moonraker update-manager entries.
#
# For reference (accurate documentation, not something Moonraker reads
# for these reserved names): Klipper is the checkout at
# $ROSETTEOS_ROOT/apps/klipper (github.com/Klipper3d/klipper,
# master branch), bind-mounted onto /opt/klipper by S05rosetteos-activate,
# seeded by S04rosetteos-factory-seed. Moonraker is the checkout at
# $ROSETTEOS_ROOT/apps/moonraker (github.com/Arksine/moonraker, master
# branch), running from the venv at $ROSETTEOS_ROOT/envs/moonraker. Both
# paths are what Klippy/Moonraker already report live via their own
# discovery mechanisms - not something this config controls.
#
# NebulaOS auto-updates-camera-complete mission (2026-07-28, see
# docs/NEBULAOS_MOONRAKER_UPDATE_AND_CAMERA_ANALYSIS.md): Klipper's
# production branch was "nebulaos" until this mission, which does not
# match the hardcoded "master" primary_branch default Moonraker's
# reserved klipper slot falls back to when the option is absent
# (git_deploy.py's `config.get("primary_branch", "master")` - never
# overridable for reserved slots, primary_branch isn't in
# OPTION_OVERRIDES). Combined with the factory seed's old synthetic
# wrapper commit (see S04rosetteos-factory-seed's own history), this made
# every freshly-seeded device's klipper/moonraker permanently
# diverged=true / is_valid=false, blocking every real update. Klipper's
# official mainline Klipper remains the runtime; the factory build copies the
# required NebulaOS klippy/extras files from the separately pinned source
# checkout configured in manifests/dependencies.conf.
[update_manager klipper]
channel: dev

[update_manager moonraker]
channel: dev

[update_manager mainsail]
type: web
channel: beta
repo: mainsail-crew/mainsail
path: /usr/data/rosetteos/apps/mainsail

[authorization]
trusted_clients:
 127.0.0.1
 192.168.0.0/16
 10.0.0.0/8
cors_domains:
 http://*.local
 http://*.lan
