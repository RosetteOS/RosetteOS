# Ender-3 V2 Neo - RosetteOS Klipper configuration

[respond]
default_type: echo

[firmware_retraction]
retract_length: 5.0
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
minimum_cruise_ratio: 0.5
max_z_velocity: 10
square_corner_velocity: 5.0
max_z_accel: 100

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 240
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 225
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5
homing_speed: 5

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -40.0
y_offset: -10.0
z_offset: 0
speed: 5
stow_on_each_sample: false
probe_with_touch_mode: true

[safe_z_home]
home_xy_position: 160, 120
speed: 100
z_hop: 10
z_hop_speed: 5

[extruder]
max_extrude_only_distance: 1000.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 32.473
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 29.291
pid_Ki: 1.743
pid_Kd: 123.021
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 67.104
pid_Ki: 0.544
pid_Kd: 2068.466
min_temp: 0
max_temp: 110

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.0100
hardware_pwm: false
shutdown_speed: 0.0
off_below: 0.07

[heater_fan nozzle_fan]
pin: PC0
max_power: 1.0
shutdown_speed: 0
heater: extruder
heater_temp: 60
fan_speed: 1.0

[bed_mesh]
speed: 150
mesh_min: 30, 30
mesh_max: 189, 189
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]

[skew_correction]

[exclude_object]

# --- Core Hardware & Sensors ---
[include hardware/nebula_pad.cfg]

# --- Print Controls & Workflow Macros ---
[include macros/print_start.cfg]
[include macros/mainsail.cfg]
[include macros/m600.cfg]
[include macros/print_settings.cfg]
[include macros/adaptive_meshing.cfg]
[include macros/line_purge.cfg]
[include macros/smart_park.cfg]
[include macros/camera.cfg]
[include macros/profiles.cfg]
[include macros/apps.cfg]

# --- Screen Integration ---
[include GuppyScreen/guppy_cmd.cfg]

# --- User Custom Overrides ---
[include user.cfg]

[bed_screws]
screw1: 30, 25
screw1_name: front left screw
screw2: 200, 25
screw2_name: front right screw
screw3: 200, 195
screw3_name: rear right screw
screw4: 30, 195
screw4_name: rear left screw
horizontal_move_z: 5
speed: 150

[screws_tilt_adjust]
screw1: 70, 35
screw1_name: front left screw
screw2: 240, 35
screw2_name: front right screw
screw3: 240, 205
screw3_name: rear right screw
screw4: 70, 205
screw4_name: rear left screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4
