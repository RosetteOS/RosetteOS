# Ender-3 V3 KE - hardware configuration for upstream Klipper.
#
# Custom user macros, overrides, and personal settings should be placed in user.cfg.
# Calibrated parameters (Z-offset, Bed Mesh, PID tunes) are saved automatically
# at the bottom of this file in the SAVE_CONFIG block.

[respond]
default_type: echo

[firmware_retraction]
retract_length: 0.6
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

# [force_move] is provided by upstream Klipper only when explicitly configured;
# this printer configuration does not require a force_move section.

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 8000
# ke-mainline-klipper stock-parity mission: max_accel_to_decel is
# deprecated upstream; 0.6875 = 1 - min(1, max_accel_to_decel/max_accel)
# is the exact equivalent per this build's own toolhead.py, so this is a
# zero-behavior-change migration (see the deployed device's printer.cfg
# for the fuller explanation).
minimum_cruise_ratio: 0.6875
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.150

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# Real bug found live (Moonraker update/camera implementation mission,
# 2026-07-27): z_offset is a required option for Klipper's bltouch.py
# extra - with no value at all, Klipper hard-fails to load
# ("Option 'z_offset' in section 'bltouch' must be specified"), which
# blocks the whole printer from ever becoming ready. This went
# undiscovered for the entire project because until this mission's own
# Phase I clean-install test, printer.cfg had never actually been
# reseeded from this squashfs default on a truly empty namespace - every
# earlier real-device session already had an already-configured,
# already-calibrated printer.cfg in place. The original omission here was
# deliberate (see this file's own header: the real device's SAVE_CONFIG
# block, including its calibrated z_offset, was intentionally dropped
# since it was measured against the old stock kernel/firmware and
# shouldn't be trusted blindly on this build) - but omitting the value
# entirely broke Klipper's ability to start at all, which is worse than
# shipping an explicit, safe starting point. 0 is the correct fresh-install
# default for this exact reason: it cannot cause the nozzle to crash into
# the bed (unlike a stale negative value would risk), and PROBE_CALIBRATE
# must still be run before real printing to get the true, correct value
# for this physical printer.
z_offset: 0
probe_with_touch_mode: true
stow_on_each_sample: false
speed: 5
lift_speed: 20

# Pure upstream Klipper configuration: the former load-cell PRtouch and
# z_compensate sections were fork-only and are intentionally not loaded.

[safe_z_home]
home_xy_position: 110, 110
speed: 100
z_hop: 10
z_hop_speed: 5

[filament_switch_sensor filament_sensor]
switch_pin: !PC15
pause_on_runout: false
runout_gcode: M600

[output_pin MainBoardFan]
pin: !PB1

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.036
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 20.584
pid_Ki: 1.737
pid_Kd: 60.981
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 70.652
pid_ki: 1.798
pid_kd: 694.157
min_temp: 0
max_temp: 120

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.0100
hardware_pwm: false
shutdown_speed: 0.0
off_below: 0.07

[heater_fan nozzle_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[bed_mesh]
speed: 350
mesh_min: 5,10
mesh_max: 215,215
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[input_shaper]

[skew_correction]

# Moonraker populates exclude_object.objects with per-object polygons from
# sliced-gcode metadata; with no object metadata it remains an empty list.
[exclude_object]

# --- Core Hardware & Sensors ---
[include hardware/nebula_pad.cfg]
[include hardware/v3_features.cfg]

# --- Print Controls & Workflow Macros ---
[include macros/print_start.cfg]
[include macros/mainsail.cfg]
[include macros/m600.cfg]
[include macros/print_settings.cfg]
[include macros/adaptive_meshing.cfg]
[include macros/line_purge.cfg]
[include macros/smart_park.cfg]
[include macros/camera.cfg]
[include macros/profiles.cfg]
[include macros/apps.cfg]

# --- Screen Integration ---
[include GuppyScreen/guppy_cmd.cfg]

# --- User Custom Overrides ---
[include user.cfg]
