# RosetteOS Package Manager (opkg) Configuration
# Entware-compatible repository for Ingenic X2000 (MIPS32r2 Little-Endian)

dest root /

arch all 100
arch mipsel 150
arch mipsel-3x 160
arch mipsel-3.4 170
arch x2000 200

src/gz entware http://bin.entware.net/mipselsf-k3.4

option lists_dir /opt/var/lib/opkg/lists
option info_dir /opt/var/lib/opkg/info
option status_file /opt/var/lib/opkg/status
option tmp_dir /tmp
option overlay_root /usr/data
option force_space 1
