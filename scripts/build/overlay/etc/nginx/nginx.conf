worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # RosetteOS app-stack addition (FIRMWARE.md sec 13): the real, canonical
    # Moonraker reverse-proxy config, adapted from mainsail-crew/kiauh's own
    # published template (kiauh/components/webui_client/assets/nginx_cfg +
    # common_vars.conf + upstreams.conf) - not invented from scratch.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream apiserver {
        ip_hash;
        server 127.0.0.1:7125;
    }

    # matches ustreamer's --port in S50webcam
    upstream mjpgstreamer1 {
        ip_hash;
        server 127.0.0.1:8080;
    }

    server {
        listen 80;

        access_log /var/log/nginx/mainsail-access.log;
        error_log  /var/log/nginx/mainsail-error.log;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_proxied expired no-cache no-store private auth;
        gzip_comp_level 4;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

        root /var/run/rosetteos-web-root;
        index index.html;
        server_name _;

        client_max_body_size 0;
        proxy_request_buffering off;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://apiserver/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://apiserver$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        location /webcam/ {
            postpone_output 0;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Buffering;
            access_log off;
            # Not "error_log off;" - unlike access_log, error_log has no
            # "off" keyword; nginx parses it as a filename, resolving to
            # <prefix>/off ("/usr/off" on this build), which nginx then
            # tries to open on this read-only squashfs and fails hard -
            # this alone was silently killing the entire nginx process
            # (and therefore Mainsail) on every single boot. Omitting the
            # directive here inherits the parent server block's real,
            # writable error_log (line 37) instead.
            proxy_pass http://mjpgstreamer1/;
        }
    }
}
