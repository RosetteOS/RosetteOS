# Authoritative dependency pin manifest for the RosetteOS firmware build.
#
# One rule: every immutable external source this build depends on has its
# exact pinned ref recorded HERE, and nowhere else. GuppyScreen is the one
# explicit branch exception and follows its configured branch. The
# NebulaOS extras source is pinned independently from the mainline Klipper
# runtime.
# The fetch script sources this file rather than hardcoding pins inline (previously each pin
# lived as a shell variable scattered across that script - functionally equivalent, but
# "the one obvious authoritative file" was not obvious).
#
# Format: plain shell variable assignments (this file is `.`-sourced by
# 00-fetch-vendor-sources.sh directly - no parsing dependency, no jq/python
# needed this early in the pipeline). Comments and blank lines allowed.
#
# To bump an immutable dependency: edit the value below, in its own reviewed
# commit, then re-run 00-fetch-vendor-sources.sh. The kernel and GuppyScreen
# do not use this pin workflow; their fetched SHAs are recorded in
# build-manifest.txt after each build.
#
# A dependency with NO entry here, or an entry left as the placeholder
# UNPINNED_MUST_SET_BEFORE_BUILD, causes 00-fetch-vendor-sources.sh to fail
# immediately, by design - see its own "required pin" check.

# --- RosetteOS Release Version ---
ROSETTEOS_VERSION=1.0.0

# --- RosetteOS/System (pinned OKE commit, full checkout supplying kernel + Buildroot) ---
#
# 2026-09-01: pin the canonical Open Klipper Edition System checkout so a
# build does not refresh or modify vendor/system when it already matches.
SYSTEM_REPO=https://github.com/RosetteOS/System.git
SYSTEM_PIN=de33e48a79f4e1ce5d820b7e0720cae8b18be6b1


# --- Klipper runtime (official upstream, compatibility-qualified commit) ---
#
# Keep the runtime itself mainline. The extensions manifest requires this
# upstream commit because it validates Klipper's host API before startup.
KLIPPER_REPO=https://github.com/Klipper3d/klipper.git
KLIPPER_BRANCH=master
KLIPPER_PIN=58bd67db3ce1be1951c3e4a6d1156a79903d4edc

# --- NebulaOS Klipper extras (pinned source checkout) ---
#
# Only the host-side extras are taken from this repository; its Klipper core
# is never used as the runtime.
KLIPPER_EXTRAS_REPO=https://github.com/coreflake1/NebulaOS-klipper-extensions.git
KLIPPER_EXTRAS_PIN=adfad73f74defe93c8d3e797972b06471be9c25f

# --- Printer MCU firmware (NebulaOS-owned thin build repository) ---
#
# This repository contains only the explicit GD32F303 target patch queue and
# Creality pack/validate/flash tooling; it fetches official Klipper itself.
# Keep the repository commit pinned here so a rootfs build cannot silently
# change the firmware that the boot-time updater is authorized to write.
MCU_REPO=https://github.com/coreflake1/NebulaOS-klipper-mcu.git
MCU_PIN=2c9bab5be07deef4c8df6d7db3b614d748a18065
MCU_METADATA_VERSION=900
MCU_EXPECTED_HW_ID=mcu0_001_G32

# --- Moonraker (official, not forked) ---
MOONRAKER_REPO=https://github.com/Arksine/moonraker.git
MOONRAKER_PIN=985c1d0bbeb90bc057d34a232c9dc3b05e0c6c8d
# Pure-Python dependency whose upstream requirement is intentionally broad;
# pin the artifact used in the offline rootfs so wheel caching is reproducible.
MOONRAKER_PYASN1_VERSION=0.6.4

# --- Camera pipeline (real GPLv3 uStreamer port for this board family) ---
K1_USTREAMER_REPO=https://github.com/pellcorp/k1-ustreamer.git
K1_USTREAMER_PIN=18e30bb313d54b1b01dd995bd31ce5a3d5adffd6


# --- Mainsail (built Vue app, fetched as a release archive - pinned by tag
# AND a sha256 of the downloaded zip, not a git ref) ---
MAINSAIL_TAG=v2.19.0
MAINSAIL_SHA256=c4d9d96f89851c6ae0709c2f20725447f3fe8c57cf193869b0083441bd93378a

# --- Board NVRAM (Cypress/Broadcom-format, board-specific calibration data) ---
#
# 2026-08-07 (canonical-repository mission): redistribution explicitly
# authorized by the repository owner - see LICENSES/WIFI-FIRMWARE-NOTICE.md
# for the full provenance/license reasoning. Published as a GitHub Release
# asset on this same repo (wifi-firmware-v1.0.0) and fetched the same way
# Mainsail is above: pinned tag + URL + archive sha256, individual file
# hash checked after extraction.
#
# 2026-08-09 (WiFi .125 promotion): this pin now covers ONLY the NVRAM
# (.txt) file. The .bin/.clm_blob pair that used to travel in the same
# release archive (the obsolete 7.46.58.13 control firmware) is retired -
# see WIFI_FIRMWARE_BIN_SHA256/WIFI_FIRMWARE_CLM_SHA256 below, now sourced
# directly from Infineon's own upstream repo instead. The NVRAM itself is
# real per-board calibration data extracted from this project's own
# hardware, unrelated to which firmware build is running, and stays
# byte-identical across this promotion (confirmed live: unchanged on the
# running device both before and after the .125 switch).
WIFI_FIRMWARE_RELEASE_TAG=wifi-firmware-v1.0.0
WIFI_FIRMWARE_RELEASE_URL=https://github.com/coreflake1/NebulaOS-firmware/releases/download/wifi-firmware-v1.0.0/nebulaos-wifi-firmware-1.0.0.tar.gz
WIFI_FIRMWARE_ARCHIVE_SHA256=20c22ee2e3b7469b1240f991457e7217d3b1c8d858595754582e4f097311b08c
WIFI_FIRMWARE_TXT_SHA256=78fee458ab69c0a66ea462f6d6769e15b36f73582693f4dbb5a0e8e8be3cfb0a

# --- Canonical CYW43430 WiFi firmware + CLM (Infineon ifx-linux-firmware,
# 7.45.98.125) ---
#
# 2026-08-09: promoted from the previous 7.46.58.13 control build after
# successful hardware qualification (see
# docs/NEBULAOS_WIFI_125_ENGINEERING_TEST.md's "Correction" section for the
# full incident writeup and live verification evidence). Fetched directly
# from Infineon's own public repo by
# scripts/firmware/fetch-cyw43430-wifi-firmware.sh - see that script's own
# header for the license basis (Cypress Wireless Connectivity Devices
# Driver EULA, same family already accepted for this build's other
# firmware). Pinned to an exact commit (the tag's own dereferenced target,
# not a moving ref) AND individual file sha256 - a version bump means
# re-deriving both deliberately.
WIFI_FIRMWARE_INFINEON_REPO=https://github.com/Infineon/ifx-linux-firmware.git
WIFI_FIRMWARE_INFINEON_TAG=release-v5.10.9-2022_0909
WIFI_FIRMWARE_INFINEON_PIN=4334275b5801bcf5256c3101395e7bc983ce640d
WIFI_FIRMWARE_BIN_SHA256=82ed67a211877efa47aff4aab83d6d2d1ccf3d5d0f5c396df97f292ade01de9e
WIFI_FIRMWARE_CLM_SHA256=1dbe1a396b68786bb189b7c255318ae546fd2e9d15f70ccc8ecbdc52b6cd4c47

# --- GuppyScreen (RosetteOS, pinned source checkout) ---
GUPPYSCREEN_REPO=https://github.com/RosetteOS/GuppyScreen.git
GUPPYSCREEN_PIN=ebe0cffc39126edd00f03183b8ff91abaecbb99f
GUPPYSCREEN_THEME=blue

