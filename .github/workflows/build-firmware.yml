name: Build firmware

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - rosetteos-rebrand
  pull_request:
    branches:
      - main
      - rosetteos-rebrand

permissions:
  contents: write
  packages: read

concurrency:
  group: rosetteos-firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # The build compares the generated configuration against the
          # explicitly promoted QUALIFIED_BASELINE_TAG in dependencies.conf.
          # A shallow checkout omits that tag and makes the otherwise-valid
          # baseline fail before the build starts.
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep the pinned source checkouts, Buildroot download cache, and
      # application-stage downloads. This cache uses a run-specific key so a
      # failed fetch/build can publish a more complete state for the next run.
      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/rosetteos
          key: rosetteos-dependencies-v2-${{ runner.os }}-${{ hashFiles('manifests/dependencies.conf') }}-${{ github.run_id }}
          restore-keys: |
            rosetteos-dependencies-v2-${{ runner.os }}-${{ hashFiles('manifests/dependencies.conf') }}-
            rosetteos-dependencies-v2-${{ runner.os }}-

      - name: Materialize dependency cache
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d .cache/rosetteos/vendor ]]; then
            mkdir -p vendor
            rsync -a .cache/rosetteos/vendor/ vendor/
          fi

          if [[ -d .cache/rosetteos/buildroot-dl && -d vendor/system/.git ]]; then
            mkdir -p vendor/system/buildroot/output/dl
            rsync -a .cache/rosetteos/buildroot-dl/ vendor/system/buildroot/output/dl/
          fi

          if [[ -d .cache/rosetteos/vendor-downloads ]]; then
            mkdir -p vendor-downloads
            rsync -a .cache/rosetteos/vendor-downloads/ vendor-downloads/
          fi

          if [[ -d .cache/rosetteos/build-work ]]; then
            mkdir -p build-work
            rsync -a .cache/rosetteos/build-work/ build-work/
          fi

          if [[ -d .cache/rosetteos/firmware ]]; then
            mkdir -p scripts/build/overlay/lib/firmware
            rsync -a .cache/rosetteos/firmware/ scripts/build/overlay/lib/firmware/
          fi

      # Preserve the generated Buildroot state separately so a later run of
      # the same build inputs can resume after an incomplete toolchain or
      # package build. Only prepare this path when the dependency cache already
      # supplied vendor/system; on a cold cache, Stage 00 must clone into an
      # empty destination first.
      - name: Prepare Buildroot output cache directory
        id: prepare-build-cache
        shell: bash
        run: |
          if [[ -d vendor/system/.git ]]; then
            mkdir -p vendor/system/buildroot/output
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Buildroot output cache
        id: build-cache
        if: steps.prepare-build-cache.outputs.available == 'true'
        uses: actions/cache/restore@v4
        with:
          path: vendor/system/buildroot/output
          # Assertion-only changes do not invalidate the compiled Buildroot
          # state, so a comparator fix can reuse the failed run's output.
          key: rosetteos-build-v2-${{ runner.os }}-${{ hashFiles('build.sh', 'scripts/build/*.sh', 'scripts/build/configs/**', 'scripts/build/patches/**', 'scripts/build/overlay/etc/init.d/**', 'scripts/build/overlay/etc/*.sh', 'scripts/build/overlay/etc/*.conf', 'scripts/build/overlay/etc/profile.d/**', 'scripts/build/overlay/etc/sysctl.d/**', 'scripts/build/overlay/etc/network/**', 'scripts/build/overlay/etc/nginx/**', 'scripts/build/overlay/etc/udev/**', 'scripts/build/overlay/etc/hwrevision', 'scripts/build/overlay/etc/rosetteos-version', 'scripts/build/overlay/etc/sw-versions', 'scripts/build/overlay/etc/swupdate.cfg', 'scripts/build/overlay/etc/os-release', 'scripts/build/overlay/usr/bin/**', 'scripts/build/overlay/usr/libexec/**', 'scripts/build/overlay/opt/rosetteos/**', 'scripts/build/overlay/opt/rosetteos-seeds/**', 'scripts/build/overlay/opt/guppyscreen/guppyconfig.json', 'scripts/build/overlay/opt/guppyscreen/themes/**', 'scripts/build/overlay/opt/printer_data/config/*.cfg', 'scripts/build/overlay/opt/printer_data/config/*.conf', 'scripts/build/overlay/opt/printer_data/config/hardware/**', 'scripts/build/overlay/opt/printer_data/config/macros/**', 'scripts/build/overlay/opt/printer_data/config/GuppyScreen/**', 'artifacts/buildroot-halley5-v30-image/*.config', 'artifacts/buildroot-halley5-v30-image/*.dts', 'manifests/dependencies.conf') }}-${{ github.run_id }}
          restore-keys: |
            rosetteos-build-v2-${{ runner.os }}-${{ hashFiles('build.sh', 'scripts/build/*.sh', 'scripts/build/configs/**', 'scripts/build/patches/**', 'scripts/build/overlay/etc/init.d/**', 'scripts/build/overlay/etc/*.sh', 'scripts/build/overlay/etc/*.conf', 'scripts/build/overlay/etc/profile.d/**', 'scripts/build/overlay/etc/sysctl.d/**', 'scripts/build/overlay/etc/network/**', 'scripts/build/overlay/etc/nginx/**', 'scripts/build/overlay/etc/udev/**', 'scripts/build/overlay/etc/hwrevision', 'scripts/build/overlay/etc/rosetteos-version', 'scripts/build/overlay/etc/sw-versions', 'scripts/build/overlay/etc/swupdate.cfg', 'scripts/build/overlay/etc/os-release', 'scripts/build/overlay/usr/bin/**', 'scripts/build/overlay/usr/libexec/**', 'scripts/build/overlay/opt/rosetteos/**', 'scripts/build/overlay/opt/rosetteos-seeds/**', 'scripts/build/overlay/opt/guppyscreen/guppyconfig.json', 'scripts/build/overlay/opt/guppyscreen/themes/**', 'scripts/build/overlay/opt/printer_data/config/*.cfg', 'scripts/build/overlay/opt/printer_data/config/*.conf', 'scripts/build/overlay/opt/printer_data/config/hardware/**', 'scripts/build/overlay/opt/printer_data/config/macros/**', 'scripts/build/overlay/opt/printer_data/config/GuppyScreen/**', 'artifacts/buildroot-halley5-v30-image/*.config', 'artifacts/buildroot-halley5-v30-image/*.dts', 'manifests/dependencies.conf') }}-
            rosetteos-build-v2-${{ runner.os }}-

      - name: Build and verify firmware
        id: build
        run: ./build.sh

      # Run even when ./build.sh fails. This stages the source/download state
      # for the dependency cache; the separate Buildroot output cache is saved
      # directly below. Both save steps are best-effort so a cache-size or
      # cache-service problem never hides the real build failure.
      - name: Prepare dependency cache for next run
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .cache/rosetteos
          mkdir -p .cache/rosetteos/vendor

          # Preserve source checkouts and git metadata, but omit the generated
          # Buildroot output tree. It is rebuilt by the canonical pipeline.
          if [[ -d vendor ]]; then
            rsync -a --exclude='system/buildroot/output/' vendor/ .cache/rosetteos/vendor/
          fi

          if [[ -d vendor/system/buildroot/output/dl ]]; then
            mkdir -p .cache/rosetteos/buildroot-dl
            rsync -a vendor/system/buildroot/output/dl/ .cache/rosetteos/buildroot-dl/
          fi

          if [[ -d vendor-downloads ]]; then
            mkdir -p .cache/rosetteos/vendor-downloads
            rsync -a vendor-downloads/ .cache/rosetteos/vendor-downloads/
          fi

          if [[ -d build-work ]]; then
            mkdir -p .cache/rosetteos/build-work
            rsync -a build-work/ .cache/rosetteos/build-work/
          fi

          if [[ -d scripts/build/overlay/lib/firmware ]]; then
            mkdir -p .cache/rosetteos/firmware
            rsync -a scripts/build/overlay/lib/firmware/ .cache/rosetteos/firmware/
          fi

      - name: Save dependency cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/rosetteos
          key: rosetteos-dependencies-v2-${{ runner.os }}-${{ hashFiles('manifests/dependencies.conf') }}-${{ github.run_id }}

      - name: Save Buildroot output cache
        if: ${{ always() && hashFiles('vendor/system/buildroot/Makefile') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/system/buildroot/output
          key: rosetteos-build-v2-${{ runner.os }}-${{ hashFiles('build.sh', 'scripts/build/*.sh', 'scripts/build/configs/**', 'scripts/build/patches/**', 'scripts/build/overlay/etc/init.d/**', 'scripts/build/overlay/etc/*.sh', 'scripts/build/overlay/etc/*.conf', 'scripts/build/overlay/etc/profile.d/**', 'scripts/build/overlay/etc/sysctl.d/**', 'scripts/build/overlay/etc/network/**', 'scripts/build/overlay/etc/nginx/**', 'scripts/build/overlay/etc/udev/**', 'scripts/build/overlay/etc/hwrevision', 'scripts/build/overlay/etc/rosetteos-version', 'scripts/build/overlay/etc/sw-versions', 'scripts/build/overlay/etc/swupdate.cfg', 'scripts/build/overlay/etc/os-release', 'scripts/build/overlay/usr/bin/**', 'scripts/build/overlay/usr/libexec/**', 'scripts/build/overlay/opt/rosetteos/**', 'scripts/build/overlay/opt/rosetteos-seeds/**', 'scripts/build/overlay/opt/guppyscreen/guppyconfig.json', 'scripts/build/overlay/opt/guppyscreen/themes/**', 'scripts/build/overlay/opt/printer_data/config/*.cfg', 'scripts/build/overlay/opt/printer_data/config/*.conf', 'scripts/build/overlay/opt/printer_data/config/hardware/**', 'scripts/build/overlay/opt/printer_data/config/macros/**', 'scripts/build/overlay/opt/printer_data/config/GuppyScreen/**', 'artifacts/buildroot-halley5-v30-image/*.config', 'artifacts/buildroot-halley5-v30-image/*.dts', 'manifests/dependencies.conf') }}-${{ github.run_id }}

      - name: Collect failure diagnostics
        if: ${{ always() && steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          for file in \
            artifacts/buildroot-halley5-v30-image/kernel.config \
            artifacts/buildroot-halley5-v30-image/buildroot.config \
            artifacts/buildroot-halley5-v30-image/halley5_v30.dts \
            artifacts/buildroot-halley5-v30-image/build-manifest.txt; do
            if [[ -f "$file" ]]; then
              cp "$file" ci-diagnostics/
            fi
          done
          git status --short > ci-diagnostics/git-status.txt
          du -sh vendor/system/buildroot/output 2>/dev/null > ci-diagnostics/buildroot-output-size.txt || true

      - name: Upload failure diagnostics
        if: ${{ always() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: rosetteos-build-diagnostics-${{ github.sha }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble artifact bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          image_dir=artifacts/buildroot-halley5-v30-image
          bundle=ci-artifacts
          mkdir -p "$bundle/images" "$bundle/guppyscreen"

          # 1. Generate changelog and build SWUpdate (.swu) package
          sh scripts/build/lib/generate-changelog.sh "$bundle/changelog.txt" 15 15
          sh scripts/build/package-swu.sh "$bundle" "nightly" "$bundle/changelog.txt"

          # 2. Generate GuppyScreen-compatible release manifest
          python3 scripts/build/lib/generate-release-manifest.py \
            --swu "$bundle/rosetteos-update-nightly.swu" \
            --output "$bundle/releases.json" \
            --changelog "$bundle/changelog.txt" \
            --channel "nightly" \
            --tag "nightly"

          cp "$image_dir/xImage" \
             "$image_dir/rootfs.squashfs" \
             "$image_dir/build-manifest.txt" \
             "$image_dir/kernel.config" \
             "$image_dir/buildroot.config" \
             "$image_dir/halley5_v30.dts" \
             "$bundle/images/"

          if [[ -f "$image_dir/Ender3V3SE_klipper.bin" ]]; then
            cp "$image_dir/Ender3V3SE_klipper.bin" "$bundle/images/"
          fi
          if [[ -f "$image_dir/Ender3V2Neo_klipper.bin" ]]; then
            cp "$image_dir/Ender3V2Neo_klipper.bin" "$bundle/images/"
          fi

          cp artifacts/guppyscreen-mips/guppyscreen \
             artifacts/guppyscreen-mips/guppybeep \
             "$bundle/guppyscreen/"
          cp manifests/dependencies.conf "$bundle/"

          (
            cd "$bundle"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$bundle/SHA256SUMS"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rosetteos-firmware-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish Nightly Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rosetteos-rebrand')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          bundle=ci-artifacts
          TAG="nightly"
          TITLE="Nightly"

          release_files=(
            "$bundle/rosetteos-update-nightly.swu"
            "$bundle/rosetteos-update-nightly.swu.sha256"
            "$bundle/releases.json"
            "$bundle/changelog.txt"
            "$bundle/SHA256SUMS"
            "$bundle/images/xImage"
            "$bundle/images/rootfs.squashfs"
            "$bundle/images/build-manifest.txt"
          )

          if [[ -f "$bundle/images/Ender3V3SE_klipper.bin" ]]; then
            release_files+=("$bundle/images/Ender3V3SE_klipper.bin")
          fi
          if [[ -f "$bundle/images/Ender3V2Neo_klipper.bin" ]]; then
            release_files+=("$bundle/images/Ender3V2Neo_klipper.bin")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "== Updating existing Nightly release =="
            gh release edit "$TAG" --title "$TITLE" --notes-file "$bundle/changelog.txt" --prerelease --target "${{ github.sha }}"
            gh release upload "$TAG" "${release_files[@]}" --clobber
          else
            echo "== Creating new Nightly release =="
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$bundle/changelog.txt" \
              --prerelease \
              --target "${{ github.sha }}" \
              "${release_files[@]}"
          fi
